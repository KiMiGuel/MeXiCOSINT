[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mexicosint"
version = "2.4.0"
description = "OSINT para numeros telefonicos Mexicanos"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "KiMiGuEL" }]
dependencies = [
    "requests>=2.28.0",
    "urllib3<2",
    "beautifulsoup4>=4.11.0",
    "python-dotenv>=0.19.0",
    "lxml>=4.9.0",
    "phonenumbers>=8.13.0",
    "rich>=13.0.0",
    "opencage>=3.0.0",
    "folium>=0.14.0",
]

[project.scripts]
mexicosint = "mexicosint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mexicosint = ["data/*"]
