[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mexicosint"
version = "2.5.2"
description = "OSINT CLI for Mexican phone-number validation, IFT/PNN lookup, enrichment, and reports."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KiMiGuEL" }]
keywords = [
    "mexico",
    "osint",
    "phone-number",
    "telephone",
    "ift",
    "pnn",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "urllib3<2",
    "beautifulsoup4>=4.11.0",
    "python-dotenv>=0.19.0",
    "lxml>=4.9.0",
    "phonenumbers>=8.13.0",
    "rich>=13.0.0",
    "folium>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/KiMiGuel/MeXiCOSINT"
Documentation = "https://github.com/KiMiGuel/MeXiCOSINT#readme"
Repository = "https://github.com/KiMiGuel/MeXiCOSINT"
Issues = "https://github.com/KiMiGuel/MeXiCOSINT/issues"
Changelog = "https://github.com/KiMiGuel/MeXiCOSINT/releases"

[project.scripts]
mexicosint = "mexicosint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mexicosint = ["data/*"]
